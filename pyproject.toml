[project]
name = "educator-service"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0", "uvicorn==0.54.0", "python-multipart==0.0.32",
  "psycopg[binary]==3.2.13", "vercel-queue==0.10.0",
  "langchain-openai>=0.1.0", "langgraph>=0.2.0", "openai>=1.30.0",
  "pdfplumber>=0.11.0", "python-pptx>=0.6.23", "nbformat>=5.10.0",
  "python-dotenv>=1.0.0", "requests>=2.32.0", "beautifulsoup4>=4.12.0"
]

[tool.vercel]
entrypoint = "apps.api.main:app"

[[tool.vercel.subscribers]]
entrypoint = "apps.api.subscriber"
