name: Backend continuous deployment
on:
  push:
    branches: [main]
    paths: ['apps/api/**', '*-agent/src/**', '*-agent/prompts/**', 'pyproject.toml', 'vercel.json', 'scripts/prepare_backend.py', '.github/workflows/backend-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-production
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: educator_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/public_source_guard.py
      - run: python -m pip install -r apps/api/requirements.txt
      - run: python -m pytest tests/api -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@localhost:5432/educator_test
      - run: python scripts/export_openapi.py --check
      - run: python scripts/prepare_backend.py
      - run: npm install --global vercel@65.2.0
      - name: Deploy backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_PROJECT_ID"
          if ! vercel deploy --yes --json --verify --environment production --cwd artifacts/backend --token "$VERCEL_TOKEN" > artifacts/backend-result.json 2> artifacts/backend-private.log; then
            echo "::error::Backend deployment failed; inspect the connected Vercel project."
            exit 1
          fi
          curl --fail --silent https://educator-in-the-loop-api.vercel.app/ready
          echo "Backend: https://educator-in-the-loop-api.vercel.app/docs" >> "$GITHUB_STEP_SUMMARY"
