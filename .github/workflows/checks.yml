name: Phase 2 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/requirements.txt
      - run: python -m pytest tests/api -q
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - run: python scripts/export_openapi.py --check
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/public_source_guard.py
      - run: python -m unittest discover -s tests/harness -v
      - run: python scripts/prepare_preview.py --target demo
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        agent: [manager-agent, lecture-note-agent, practice-agent, written-exam-agent, project-exam-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '${{ matrix.agent }}/requirements.txt'
      - run: python -m pip install -r '${{ matrix.agent }}/requirements.txt'
      - name: Record resolved dependencies
        run: |
          mkdir -p artifacts/tests
          python -m pip freeze > artifacts/tests/dependencies.txt
      - run: python scripts/harness.py test --agent '${{ matrix.agent }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'regression-${{ matrix.agent }}'
          path: artifacts/tests/
          retention-days: 14
